<!DOCTYPE html>
<html lang="en">
  <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

     <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
     <link rel="stylesheet" href="./style.css">
            
     <title>Frontend Mentor | Fylo data storage component</title>

  </head>

  <body class="d-flex align-items-center justify-content-center min-vh-100">

    <main class="container">
      <div class="row justify-content-center align-items-end g-4">

<!-- Left Card: Logo & Action Icons -->
      <div class="col-12 col-md-5 col-lg-4">
        <div class="card fylo-card left-card border-0 p-4 p-md-5">
           <img src="./images/logo.svg" alt="Fylo Logo" class="mb-4" style="width: 135px;">
          <div class="d-flex gap-3">

             <button class="btn icon-box d-flex align-items-center justify-content-center" aria-label="Document">
               <img src="./images/icon-document.svg" alt="">
             </button>

             <button class="btn icon-box d-flex align-items-center justify-content-center" aria-label="Folder">
              <img src="./images/icon-folder.svg" alt="">
             </button>

             <button class="btn icon-box d-flex align-items-center justify-content-center" aria-label="Upload">
               <img src="./images/icon-upload.svg" alt="">
             </button>

          </div>
        </div>
      </div>

        <!-- ------Right card storage------ -->
        
        <div>

          <p class="storage-text">
            <strong class=""> used 815 GB </strong> of your storage
          </p>

          <span>185</span>
          <span> GB Left</span>
            
          <span> 0 GB</span>
          <span> 1000 GB</span>
        </div>
      
       </div>
    </main> 
            
   <footer class="attribution">
         Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
         Coded by <a href="#">Cedrick Mbuyamba</a>.
   </footer>
  </body>
</html>
